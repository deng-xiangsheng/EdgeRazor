# ============================================================================
# Project Metadata
# ============================================================================
[project]
name = "edgerazor"
version = "1.0.4"
description = "Lightweight is All You Need: EdgeRazor for Edge Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Shu-Hao Zhang", email = "zhangsh@lamda.nju.edu.cn" }
]
keywords = ["quantization", "edge-computing", "model-compression", "qat"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence :: Lightweight AI",
]

# Core dependencies
dependencies = [
    "ruff>=0.13.1",
    "transformers==4.53.2",
    "pyyaml>=6.0",
]

# ============================================================================
# Optional Dependencies
# ============================================================================
[project.optional-dependencies]
cpu = [
    "torch==2.7.1",
    "torchvision>=0.21.0",
]
cu126 = [
    "torch==2.7.1",
    "torchvision>=0.21.0",
]
cu128 = [
    "torch==2.7.1",
    "torchvision>=0.21.0",
]

# ============================================================================
# UV Package Manager Configuration
# ============================================================================
[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

# Prevent installing both CPU and CUDA versions simultaneously
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu126" },
        { extra = "cu128" },
    ],
]

# Package source configuration
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

# PyTorch CPU index
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# PyTorch CUDA 12.6 index
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# PyTorch CUDA 12.8 index
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# ============================================================================
# Ruff Linter & Formatter Configuration
# ============================================================================
[tool.ruff]
line-length = 88
target-version = "py310"
indent-width = 4

[tool.ruff.lint]
select = [
    # Code Quality & Style
    "E",   # pycodestyle errors - PEP 8 style violations (e.g., E501: line too long)
    "W",   # pycodestyle warnings - PEP 8 style warnings (e.g., W291: trailing whitespace)
    "F",   # pyflakes - Detect unused imports, variables, and undefined names

    # Import Management
    "I",   # isort - Automatically sort and organize import statements

    # Naming Conventions
    "N",   # pep8-naming - Enforce PEP 8 naming conventions (e.g., class names in PascalCase)

    # Modern Python Practices
    "UP",  # pyupgrade - Suggest modern Python syntax (e.g., use `list[str]` instead of `List[str]`)

    # Bug Detection
    "B",   # flake8-bugbear - Find likely bugs and design problems (e.g., mutable default arguments)

    # Code Simplification
    "C4",  # flake8-comprehensions - Suggest better list/dict/set comprehensions
]
ignore = [
    "N806",  # Allow uppercase variables in functions (common in math/ML code: W, B, etc.)
    "E501",  # Allow lines longer than 88 chars (some docstrings and URLs exceed this)
    "W293",  # Allow blank lines containing whitespace
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"