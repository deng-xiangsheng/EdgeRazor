# Quantization Configuration for ViT: W1.58-A16
# Weight: 1.58-bit (Ternary: {-1, 0, 1})
# Activation: 16-bit (No quantization)

qat_configuration:
  method: QAT
  select:
    target_types:
    - linear
    target_names: []
    exclude_types: []
    exclude_names: []
  function:
    epsilon: 1.0e-05
    weight_function: weight_quant_uniform_symmetric_clip_per_block_int1_58
    w_scale_factor: 2.0
    w_block_size: 128
    is_w_quantized: false
    activation_function: ''
    a_block_size: -1
    kv_cache_function: ''
    kv_block_size: -1
  training: all
